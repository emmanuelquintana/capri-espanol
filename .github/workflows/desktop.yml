name: Capri de escritorio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capri-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Compilar y comprobar el instalador propio
        shell: pwsh
        run: ./herramientas/compilar-desktop.ps1
      - name: Mostrar comprobación SHA-256
        shell: pwsh
        run: Get-Content entrega-desktop/SHA256SUMS.txt
