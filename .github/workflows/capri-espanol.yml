name: Capri en español
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capri-espanol-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Instalar dependencias
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Comprobar tipos
        run: bun x tsc -b packages/core packages/tui packages/cli --pretty false
      - name: Probar conexión y gateway
        working-directory: packages/cli
        run: bun test test/friendly.test.ts test/spanish.test.ts test/auth-login-choices.test.ts --timeout 30000 --only-failures
      - name: Probar interfaz de terminal en español
        working-directory: packages/tui
        run: bun test test/localization.test.tsx test/mini/blocker.responsive.test.tsx test/cli/tui/command-palette.test.tsx test/util/locale.test.ts test/util/form.test.ts test/util/permission.test.ts test/mini/permission.shared.test.ts --timeout 30000 --only-failures
      - name: Probar personalidad
        working-directory: packages/core
        run: bun test test/session-system-prompt.test.ts --only-failures
      - name: Compilar y preparar nuestra distribución
        shell: pwsh
        run: ./capri/build-release.ps1 -SkipInstall
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Capri-amigable-windows-x64
          path: |
            Capri-amigable-windows-x64.zip
            entrega/SHA256SUMS.txt
          retention-days: 7
